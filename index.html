<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#416A80">
<title>AMU · Help-immo</title>
<meta name="description" content="Assistance à la maîtrise d’usage : présentation, cadrage avec le client, contrat et présentation en un clic.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMU">
<style>:root{
  --p:#416A80; --nuit:#22394A; --a:#A1712A; --g:#6F8F6B;
  --ardoise:#A6A6A6; --brume:#D9D9D9; --papier:#F5F6F6; --blanc:#fff;
  --ink:#23333D; --mut:#6E7C85; --line:#E3E6E7;
  --pt:color-mix(in srgb,var(--p) 9%,#fff); --p2:color-mix(in srgb,var(--p) 18%,#fff);
  --at:color-mix(in srgb,var(--a) 11%,#fff); --gt:color-mix(in srgb,var(--g) 13%,#fff);
  --top:60px; --nav:66px; --rail:92px;
  --display:'Jost','Avenir Next','Century Gothic',system-ui,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papier);color:var(--ink);font:400 16px/1.45 var(--ui);
  padding:calc(var(--top) + var(--sat)) 0 calc(var(--nav) + var(--sab) + 84px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--a) 70%,#fff);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px} svg.i.lg{width:28px;height:28px}
.hide{display:none!important}

/* ---------- barre haute ---------- */
#top{position:fixed;z-index:40;top:0;left:0;right:0;height:calc(var(--top) + var(--sat));padding:var(--sat) 10px 0 12px;
  display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
#top .logo{width:38px;height:38px;flex:none}
#dossierBtn{flex:0 1 auto;min-width:0;max-width:calc(100% - 168px);display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--papier);border-radius:16px;padding:5px 10px 5px 5px;text-align:left}
#dossierBtn:hover{border-color:var(--p)}
#dossierBtn .fo{width:32px;height:32px;border-radius:11px;background:#fff;display:grid;place-items:center;color:var(--p);flex:none}
#dossierBtn .tx{min-width:0;display:flex;flex-direction:column}
.pbtn{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px 0 12px;border:0;border-radius:999px;background:var(--p);color:#fff;font-weight:700;font-size:14.5px;flex:none}
.pbtn:hover{background:var(--nuit)}
#dossierBtn .nm{font:500 16px/1.15 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dossierBtn .st{display:block;font-size:12px;color:var(--mut);font-family:var(--ui)}
#dossierBtn svg{color:var(--mut)}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--p)}
.ibtn.fill{background:var(--p);color:#fff}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ardoise);margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--g)} .dot.busy{background:var(--a)}

/* ---------- navigation ---------- */
#nav{position:fixed;z-index:40;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);
  display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid var(--line)}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font:600 11px/1 var(--ui);letter-spacing:.01em}
#nav .bub{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
#nav button.on{color:var(--p)} #nav button.on .bub{background:var(--p2)}

/* ---------- contenu ---------- */
main{max-width:760px;margin:0 auto;padding:0 16px}
.view{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}

.ttl{margin:26px 2px 6px;font:300 30px/1.08 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--nuit)}
.lead{margin:0 2px 18px;color:var(--mut);font-size:15px}
h3{margin:30px 2px 12px;font:500 19px/1.2 var(--display);color:var(--nuit);display:flex;align-items:center;gap:10px}
h3 .n{font:300 15px/1 var(--display);color:var(--mut)}
h3 .r{margin-left:auto;font:500 14px/1 var(--ui);color:var(--mut)}

/* bulle d'icône façon site (ellipse brume, trait pétrole) */
.bubble{width:52px;height:40px;border-radius:50%;background:var(--brume);color:var(--p);display:grid;place-items:center;flex:none}
.bubble.sm{width:42px;height:32px} .bubble.sm svg.i{width:18px;height:18px}
.bubble.lg{width:66px;height:50px} .bubble.lg svg.i{width:26px;height:26px}
.bubble.w{background:#fff}

.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px}
.row{display:flex;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*,.kpis>*,.set>*{min-width:0}
.f input{min-width:0}

/* ---------- bandeau pétrole (hero) ---------- */
.band{margin:0 -16px;padding:22px 16px 0;background:var(--p);color:#fff;position:relative;overflow:hidden}
.band .ttl{color:#fff;margin-top:6px}
.band .lead{color:color-mix(in srgb,#fff 78%,var(--p))}
.facade{display:block;width:100%;height:230px;margin:16px auto 0}
.facade.sky{height:auto;max-height:230px}
@media(max-width:420px){#top .logo{width:32px;height:32px}.pbtn{font-size:13.5px;padding:0 12px 0 10px}#dossierBtn .fo{width:28px;height:28px}}
.addr{display:flex;gap:8px;margin-top:4px}
.addr input{background:transparent;border:0;border-bottom:1.5px solid color-mix(in srgb,#fff 35%,var(--p));color:#fff;border-radius:0;padding:6px 0;font:300 26px/1.15 var(--display);letter-spacing:.05em;text-transform:uppercase;width:100%}
.addr input::placeholder{color:color-mix(in srgb,#fff 55%,var(--p))}
.addr input:focus{outline:none;border-color:#fff}
.addr2{display:grid;grid-template-columns:92px 1fr;gap:12px;margin-top:6px}
.addr2 input{font:400 16px/1.2 var(--ui);text-transform:none;letter-spacing:0}
.addr2.one{grid-template-columns:1fr}
.seg{display:inline-flex;gap:4px;padding:4px;margin:0 0 16px;border-radius:999px;background:color-mix(in srgb,#fff 14%,var(--p))}
.seg button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px}
.seg button.on{background:#fff;color:var(--p)}
.gl{display:grid;gap:10px}
@media(min-width:760px){.gl{grid-template-columns:1fr 1fr}}
.gcard{margin:0}
.gcard .gt{font:500 17px/1.2 var(--display);color:var(--nuit)}
.gcard .gs{color:var(--mut);font-size:13px}
.gk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gk .kpi{padding:10px 10px 10px 12px;background:var(--papier);border:0;border-radius:16px;min-width:0}
.gk .kpi .v{font-size:28px}
.gk .kpi .lb{font-size:12px}
.chip.add{border-style:dashed;color:var(--p)}
.chip.add svg.i{color:var(--p)}

/* ---------- compteurs ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 12px 12px 16px}
.kpi .lb{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;font-weight:600}
.kpi .lb svg{color:var(--p)}
.kpi .vv{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.kpi .v{font:300 38px/1 var(--display);color:var(--nuit);min-width:0}
.kpi input.v{width:100%;border:0;background:none;padding:0;-moz-appearance:textfield}
.kpi input.v::-webkit-inner-spin-button{-webkit-appearance:none}
.stp{display:flex;gap:6px}
.stp button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--papier);display:grid;place-items:center;color:var(--p)}
.stp button:active{background:var(--p2)}
.stp.sm button{width:32px;height:32px} .stp.sm svg.i{width:16px;height:16px}

/* ---------- champs ---------- */
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 5px 4px}
.f input,.f select,.f textarea{width:100%;font:500 16px/1.3 var(--ui);padding:13px 15px;border-radius:16px;border:1.5px solid var(--line);background:var(--papier);color:var(--ink);-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.f textarea{min-height:110px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--p);background:#fff}
.actor{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.actor:first-child{border-top:0;padding-top:0}
.actor .bubble{grid-row:span 2;margin-top:2px}
.actor .f{margin:0}
.actor .who{font:500 16px var(--display);color:var(--nuit);margin:6px 0 4px}
.actor .pair{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.actor .pair{grid-template-columns:1fr 1fr}}

/* ---------- tuiles / puces ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:20px;min-height:96px;padding:12px 8px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:12.5px;font-weight:600;line-height:1.2;color:var(--ink)}
.tile svg.i{color:var(--ardoise)}
.tile.on{border-color:var(--p);background:var(--pt);color:var(--nuit)}
.tile.on svg.i{color:var(--p)}
.tile .ck{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--p);color:#fff;display:none;place-items:center}
.tile .ck svg{width:12px;height:12px;stroke-width:3}
.tile.on .ck{display:grid}
.tile.on .ck svg.i{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:9px 15px 9px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14.5px;color:var(--ink)}
.chip svg.i{width:19px;height:19px;color:var(--ardoise)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip.on svg.i{color:#fff}
.chip.oc.on{background:var(--a);border-color:var(--a)}
.grp{display:flex;align-items:center;gap:8px;margin:16px 4px 8px;color:var(--mut);font-weight:600;font-size:14px}
.grp:first-child{margin-top:0}

/* interrupteur */
.sw{position:relative;width:50px;height:30px;border-radius:15px;background:var(--brume);border:0;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--a)} .sw.on::after{transform:translateX(20px)}
.sw.p.on{background:var(--p)}
.ctx{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-weight:600}
.ctx:first-child{border-top:0}
.ctx>span:not(.bubble){flex:1}

/* ---------- AMU ---------- */
.dia{display:block;width:100%;max-width:440px;margin:6px auto 0}
.eq2,.eq3{display:grid;grid-template-columns:1fr;gap:12px;align-items:stretch}
@media(min-width:560px){.eq2{grid-template-columns:1fr 1fr}}
@media(min-width:700px){.eq3{grid-template-columns:repeat(3,1fr)}}
.eq2>.card,.eq3>.card{display:flex;flex-direction:column;height:100%;margin:0}
.eq2>.card.obj{flex-direction:row;gap:14px;align-items:center}
.obj b{display:block;font:500 19px/1.2 var(--display);color:var(--nuit)}
.obj p{margin:2px 0 0;color:var(--mut);font-size:14.5px}
.duo{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.duo{grid-template-columns:1fr 1fr}}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;gap:12px;align-items:center;padding:9px 0}
.lst b{display:block;font-weight:600;font-size:15.5px}
.lst small{color:var(--mut);font-size:13.5px}
.lst .yes{color:var(--p)} .lst .no{color:var(--a)}
.card.soft{background:var(--papier)}
.card h4{margin:0 0 6px;font:500 17px var(--display);color:var(--nuit);display:flex;gap:8px;align-items:center}

/* parcours */
.path{position:relative;margin:0;padding:0;list-style:none}
.step{position:relative;display:grid;grid-template-columns:54px 1fr;gap:0 12px;padding-bottom:6px}
.step::before{content:'';position:absolute;left:26px;top:46px;bottom:-2px;width:2px;background:var(--rail,var(--brume))}
.step:last-child::before{display:none}
.step .nd{width:54px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;position:relative;z-index:1}
.step .bx{padding:3px 0 14px}
.step button.hd{display:flex;align-items:baseline;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left}
.step .cd{font:500 13px var(--display);color:var(--c);letter-spacing:.04em;min-width:44px}
.step .tt{font:500 17px/1.25 var(--display);color:var(--nuit);flex:1}
.step .wh{font-size:12.5px;color:var(--mut);white-space:nowrap}
.step .kw{display:none;margin:8px 0 2px 54px;padding:0;list-style:none}
.step.open .kw{display:block}
.step .kw li{font-size:14px;color:var(--ink);padding:3px 0 3px 14px;position:relative}
.step .kw li::before{content:'';position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.step.off{opacity:.42}
.step .tag{font-size:11.5px;font-weight:700;color:var(--a);background:var(--at);border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.phase{display:inline-flex;align-items:center;gap:8px;margin:4px 0 12px;font:500 14px var(--display);color:var(--c);letter-spacing:.04em}
.phase::before{content:'';width:22px;height:2px;background:var(--c)}

/* tandem & références */
.person{display:flex;flex-direction:column;gap:12px}
.person .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font:400 22px var(--display);letter-spacing:.06em;flex:none}
.person .nm{font:500 21px/1.15 var(--display);color:var(--nuit)}
.person .org{color:var(--mut);font-size:14px}
.person .fc{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--papier);color:var(--ink)}
.person ul{margin:0;padding:0;list-style:none;color:var(--mut);font-size:14px}
.person li{padding:2px 0}
.person .ct{display:flex;flex-direction:column;gap:6px;font-size:14px;padding-top:10px;border-top:1px solid var(--line);margin-top:auto}
.person .ct span{display:flex;gap:8px;align-items:center;color:var(--ink)} .person .ct svg{color:var(--p);width:17px;height:17px}
.ref .ph{position:relative;margin:-18px -18px 14px;aspect-ratio:3/2;border-radius:23px 23px 0 0;overflow:hidden;background:var(--pt)}
.ref .ph img{display:block;width:100%;height:100%;object-fit:cover}
.phadd{width:100%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--p);font-weight:700;font-size:14px}
.phx{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink)}
.ref .foot2{margin-top:auto;padding-top:10px}
.ref .big{font:300 54px/1 var(--display);color:var(--p);letter-spacing:-.01em}
.ref .big small{font:400 14px var(--ui);color:var(--mut);letter-spacing:0;margin-left:6px}
.ref .nm{font:500 18px/1.2 var(--display);color:var(--nuit);margin-top:12px}
.ref .meta{color:var(--mut);font-size:13.5px;margin:2px 0 10px}
.ref .w{font-size:14px;margin-bottom:10px}
.ref a{display:inline-flex;gap:6px;align-items:center;margin-bottom:6px;color:var(--p);font-weight:700;font-size:14px;text-decoration:none}
.subnav{position:sticky;top:calc(var(--top) + var(--sat));z-index:20;margin:0 -16px;padding:10px 16px;display:flex;gap:6px;overflow-x:auto;background:color-mix(in srgb,var(--papier) 92%,transparent);backdrop-filter:blur(10px);scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--ink)}
.subnav button.on{border-color:var(--p);color:var(--p)}
.anchor{scroll-margin-top:calc(var(--top) + var(--sat) + 64px)}

/* ---------- prestations ---------- */
.set{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.set{grid-template-columns:repeat(4,1fr)}}
.set .kpi .v{font-size:30px}
.pk{background:#fff;border:1px solid var(--line);border-radius:22px;margin-bottom:10px;overflow:hidden}
.pk.on.opt{border-color:color-mix(in srgb,var(--a) 45%,var(--line))}
.pk .hd{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px}
.pk .hd .tx{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column}
.pk .cd{font:500 12.5px var(--display);color:var(--mut);letter-spacing:.04em}
.pk .tt{font:500 16.5px/1.2 var(--display);color:var(--nuit)}
.pk .hh{font:300 22px/1 var(--display);color:var(--nuit);white-space:nowrap;text-align:right}
.pk .hh small{display:block;font:500 12px/1.4 var(--ui);color:var(--mut)}
.pk:not(.on) .hh,.pk:not(.on) .tt{color:var(--ardoise)}
.pk .bd{display:none;padding:2px 14px 12px;border-top:1px solid var(--line)}
.pk.open .bd{display:block}
.ln{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ln:last-child{border-bottom:0}
.ln .l{flex:1}
.ln .h{font:500 15px var(--display);min-width:46px;text-align:right}
.ln.ov .h{color:var(--a)}
.ln .rs{border:0;background:none;color:var(--a);padding:4px;display:grid}
.lock{color:var(--ardoise);width:50px;display:grid;place-items:center}
.extra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0 4px}
.extra .f{flex:1;min-width:140px;margin:0}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px;border-top:1.5px solid var(--nuit);margin-top:6px;font:500 16px var(--display)}
.sum b{font:400 24px var(--display)}
.hint{display:flex;gap:12px;align-items:center;background:var(--at);border-radius:20px;padding:12px 14px;margin:10px 0}
.hint p{margin:0;flex:1;font-size:14.5px}
.hint svg{color:var(--a)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;color:var(--p)}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.btn.a{background:var(--a);border-color:var(--a);color:#fff}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px}
.btn:active{transform:translateY(1px)}

/* ---------- planning ---------- */
.gantt{display:block;width:100%;height:auto}
.ms{list-style:none;margin:0;padding:0}
.ms li{display:grid;grid-template-columns:86px 42px 1fr;align-items:center;gap:0 10px;padding:9px 6px;border-bottom:1px solid var(--line);border-radius:10px;scroll-margin:140px}
.ms li.hl{animation:hl 2.6s ease}
@keyframes hl{0%,55%{background:var(--at);box-shadow:inset 4px 0 0 var(--a)}100%{background:transparent;box-shadow:inset 0 0 0 transparent}}
.gb{cursor:pointer;outline:none}
.gb .dt{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.gb:hover .dt,.gb:focus-visible .dt{transform:scale(1.4)}
#tip{position:fixed;z-index:95;left:0;top:0;pointer-events:none;max-width:280px;background:var(--nuit);color:#fff;font-size:13px;font-weight:600;line-height:1.35;padding:8px 12px;border-radius:12px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
.cyc{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.cyc>div{flex:none;width:122px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.cyc .nd{width:36px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;margin-bottom:4px}
.cyc b{font:500 13px var(--display);color:var(--c)}
.cyc small{font-weight:600;font-size:13px;line-height:1.25}
.cyc em{font-style:normal;font-size:12px;color:var(--mut);margin-top:auto}
.ms .dt{font:500 14px var(--display);color:var(--c)}
.ms .cd{font:500 12px var(--display);color:var(--mut)}
.ms .lb{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.ms .lb svg{color:var(--c);width:19px;height:19px}
.ms li.key .lb{font-family:var(--display);font-weight:500;color:var(--nuit)}

/* ---------- contrat / offre ---------- */
.total{padding-bottom:22px}
.total .amt{font:300 54px/1 var(--display);letter-spacing:.01em;margin:4px 0 6px;color:#fff}
.total .amt small{font-size:22px;margin-right:6px;letter-spacing:.04em}
.total .sub{color:color-mix(in srgb,#fff 75%,var(--p));font-size:14.5px}
.bars{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:16px 0 10px;background:color-mix(in srgb,#fff 18%,var(--p))}
.bars i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:color-mix(in srgb,#fff 82%,var(--p))}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}
.tab{width:100%;border-collapse:collapse;font-size:15px}
.tab td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tab td:last-child{text-align:right;font:500 16px var(--display);white-space:nowrap;padding-left:10px}
.tab td small{display:block;color:var(--mut);font-size:13px}
.tab tr.t td{border-bottom:0;border-top:1.5px solid var(--nuit);font:500 17px var(--display);padding-top:12px}
.tab tr.t td:last-child{font-size:22px}
.tab tr.sb td{color:var(--g)}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{border:0;border-radius:22px;padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);color:var(--nuit)}
.ex b{font:500 17px/1.2 var(--display)}
.ex small{color:var(--mut);font-size:13px;font-weight:600}
.ex.main{grid-column:1/-1;background:var(--nuit);color:#fff;border-color:var(--nuit);min-height:0;flex-direction:row;align-items:center;gap:14px}
.ex.main .bubble{background:color-mix(in srgb,#fff 14%,var(--nuit));color:#fff}
.ex.main small{color:color-mix(in srgb,#fff 70%,var(--nuit))}
.ex.main div{flex:1}
.ex .bubble.sm{margin-bottom:10px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin:0 -16px;padding-left:16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:none;width:220px;border:0;padding:0;background:none;scroll-snap-align:start;border-radius:10px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(34,57,74,.10)}
.paper{background:#fff;border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 30px rgba(34,57,74,.10);padding:26px 22px;font-size:12.5px;line-height:1.5;color:#222;margin:4px 0 0}
.paper .ct-h{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.paper .ct-h b{font:300 20px var(--display);letter-spacing:.08em;color:var(--p)}
.paper .ct-h small{display:block;color:var(--mut);font-size:11px}
.paper h1{font:300 22px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--nuit);margin:4px 0 2px}
.paper .sub{color:var(--mut);margin-bottom:12px}
.paper h2{font:500 14px var(--display);color:var(--p);margin:18px 0 6px;letter-spacing:.02em}
.paper p{margin:4px 0}
.paper ul{margin:4px 0;padding-left:18px}
.paper table{width:100%;border-collapse:collapse;margin:6px 0;font-size:11.5px}
.paper th{background:var(--p);color:#fff;text-align:left;padding:5px 7px;font-weight:600}
.paper td{padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:top}
.paper td.r,.paper th.r{text-align:right;white-space:nowrap}
.paper tr.tot td{font-weight:700;border-top:1.5px solid var(--nuit);border-bottom:0}
.paper tr.tg td{background:var(--papier);font-weight:700;color:var(--nuit)}
.paper .kv{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;margin:4px 0}
.paper .kv b{color:var(--mut);font-weight:600}
.paper .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.paper .sign div{border-top:1px solid #333;padding-top:6px;min-height:84px;font-size:11px}
.paper .note{color:var(--mut);font-size:11.5px}
.paper .pb{border-top:1px dashed var(--brume);margin:20px 0}

/* ---------- pastille total flottante ---------- */
#pill{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--sab) + 12px);display:flex;align-items:center;gap:14px;
  padding:9px 9px 9px 18px;border-radius:999px;background:var(--nuit);color:#fff;box-shadow:0 10px 28px rgba(34,57,74,.32);border:0;white-space:nowrap}
#pill .h{font:300 18px var(--display);color:color-mix(in srgb,#fff 70%,var(--nuit))}
#pill .c{font:400 20px var(--display);letter-spacing:.02em}
#pill .go{width:36px;height:36px;border-radius:50%;background:var(--a);display:grid;place-items:center}
#pill .go svg{width:18px;height:18px}

/* ---------- panneau dossiers ---------- */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(34,57,74,.42);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .pan{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + var(--sab));animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--brume);margin:4px auto 10px}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.dl li.cur .nm{color:var(--p)}
.dl .o{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.dl .nm{display:block;font:500 16px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl small{color:var(--mut);font-size:12.5px}
.del{border:0;background:none;color:var(--mut);padding:8px;border-radius:12px;font-weight:700;font-size:13px}
.del.arm{background:#B4442F;color:#fff}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 6px}
.acts button{border:1px solid var(--line);background:var(--papier);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--p)}
.cols{display:flex;gap:12px;align-items:center}
.cols label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.cols input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff}

/* ---------- présentation ---------- */
#present{position:fixed;inset:0;z-index:80;background:#1a2a35;display:flex;flex-direction:column}
#present[hidden]{display:none}
#present .stage{flex:1;display:grid;place-items:center;padding:12px;min-height:0}
#present .slide{width:min(100%,calc((100vh - 96px) * var(--ar,1.7778)));box-shadow:0 20px 60px rgba(0,0,0,.35)}
#present .bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px calc(10px + var(--sab));color:#fff}
#present .bar .ibtn{color:#fff;background:rgba(255,255,255,.1)}
#present .cnt{min-width:64px;text-align:center;font:400 15px var(--display);letter-spacing:.06em}
.slide{position:relative;aspect-ratio:16/9;width:100%;container-type:inline-size;overflow:hidden;background:#fff;font-family:'Jost',sans-serif}
.slide>*{position:absolute;margin:0}
.slide .tx{display:flex;flex-direction:column;line-height:1.18;white-space:normal;overflow-wrap:anywhere}
.slide .tx .b{display:block;position:relative;padding-left:1.15em;margin-bottom:.16em}
.slide .tx .b::before{content:'•';position:absolute;left:.22em}
.slide svg.lines{left:0;top:0;width:100%;height:100%}
.slide svg.ico{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- divers ---------- */
#toast{position:fixed;z-index:90;left:50%;bottom:calc(var(--nav) + var(--sab) + 74px);transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--nuit);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14.5px;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;z-index:95;background:rgba(255,255,255,.72);backdrop-filter:blur(3px);display:grid;place-items:center}
#busy[hidden]{display:none}
#busy div{display:flex;flex-direction:column;align-items:center;gap:14px;font:500 17px var(--display);color:var(--nuit)}
#busy i{width:44px;height:44px;border-radius:50%;border:3px solid var(--brume);border-top-color:var(--p);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#printArea{display:none}
.foot{margin:36px 0 0;text-align:center;color:var(--ardoise);font:300 14px var(--display);letter-spacing:.08em}

/* ---------- grand écran ---------- */
@media(min-width:900px){
  body{padding:calc(var(--top) + var(--sat)) 0 60px var(--rail)}
  #nav{top:calc(var(--top) + var(--sat))}
  #nav{right:auto;width:var(--rail);height:auto;grid-template-columns:1fr;grid-auto-rows:80px;align-content:start;padding-top:16px;border-top:0;border-right:1px solid var(--line)}
  #nav button{font-size:12px}
  main{padding:0 32px}
  .band{margin:0 -32px;padding:30px 32px 0;border-radius:0 0 32px 32px}
  .band.hero{display:grid;grid-template-columns:1fr 300px;gap:36px;align-items:end;padding-top:36px}
  .band.hero .htx{align-self:center;padding-bottom:26px}
  .band.hero .facade{height:250px;margin:0}
  .band.total{padding-bottom:26px}
  .subnav{margin:0 -32px;padding:10px 32px}
  .thumbs{margin:0 -32px;padding-left:32px}
  #pill{bottom:22px;left:calc(50% + var(--rail) / 2)}
  #toast{bottom:84px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  #sheet{align-items:stretch;justify-content:flex-end}
  #sheet .pan{border-radius:28px 0 0 28px;max-height:none;height:100%;max-width:440px;padding-top:22px}
  .grab{display:none}
}
@media(min-width:1260px){
  main{max-width:820px;margin:0 340px 0 auto;margin-left:max(0px,calc((100vw - var(--rail) - 340px - 820px)/2))}
  #aside{display:block!important}
  #pill{display:none!important}
}
#aside{display:none;position:fixed;z-index:30;top:calc(var(--top) + var(--sat));right:0;bottom:0;width:340px;padding:22px 22px 30px;overflow:auto;background:#fff;border-left:1px solid var(--line)}
#aside .amt{font:300 40px/1 var(--display);color:var(--nuit);margin:6px 0 4px}
#aside .lbl{color:var(--mut);font-size:13.5px;font-weight:600}
#aside .btn{width:100%;margin-top:8px;justify-content:flex-start}
#aside .fac{border-radius:18px;overflow:hidden;background:var(--p);margin-bottom:18px;padding:16px 16px 0}
#aside .fac .facade{height:150px;margin:0}

/* ---------- impression (fichier ouvert hors de Claude) ---------- */
@media print{
  @page{size:A4;margin:16mm 14mm}
  body{padding:0;background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .paper{box-shadow:none;padding:0;font-size:10.5pt}
  .paper h2{break-after:avoid} .paper table,.paper .sign{break-inside:avoid}
}

@media(max-width:560px){.pk .ln{flex-wrap:wrap;row-gap:4px}.pk .ln .lbl{flex:1 1 100%}.pk .ln .stp{margin-left:auto}}

@media(max-width:560px){.ms li{grid-template-columns:118px 38px 1fr}}

.mdate:hover{background:color-mix(in srgb,var(--c) 8%,#fff)} .mdate:focus{outline:2px solid color-mix(in srgb,var(--c) 40%,#fff)}
.ex.main .btn.inv{background:color-mix(in srgb,#fff 14%,var(--nuit));border-color:transparent;color:#fff;flex:none}

.ex.main.pres .bubble{background:var(--brume);color:var(--p)} .ex.main.pres small{color:var(--mut)}
.kpi.ref .vv{gap:8px} .kpi.ref input.v{font:300 30px/1 var(--display);color:var(--nuit);width:100%;border:0;background:none;padding:0;min-width:0}
.kpi.ref input.v:focus{outline:none;border-bottom:1.5px solid var(--p)}
.chip[aria-disabled=true]{cursor:default}
.hph{border-radius:22px;overflow:hidden;height:230px;margin:16px 0 22px}

.hb{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,#fff 35%,var(--p));background:transparent;color:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px}

.mdate{position:relative;cursor:pointer}

@media(max-width:560px){.ms li{grid-template-columns:138px 36px 1fr}}

/* v1.5 */
.h3n{font:500 13px var(--ui);color:var(--mut);margin-left:-2px}

<body>
<header id="top"></header>
<nav id="nav" aria-label="Sections"></nav>
<main id="view"></main>
<aside id="aside" aria-label="Récapitulatif"></aside>
<div id="pill" role="button" tabindex="0" aria-label="Voir le contrat"></div>

    const wall = ghost ? mix(C.wall, P, .45) : C.wall, glass = ghost ? mix(C.glass, P, .5) : C.glass;
    if ((+b.g.n || 0) > 1) rect(x + w * .35, y0 - .9, w * .8, h + .9, C.back, .1);

async function processPhoto(file, i) {

  const yrs = []; for (let y = addMonths(s.planning.debut, mn).getFullYear() + 1; y <= addMonths(s.planning.debut, mx).getFullYear(); y++) { const base = addMonths(s.planning.debut, 0); const m = (y - base.getFullYear()) * 12 - base.getMonth(); if (m > mn && m < mx && X(m) > pad + 62 && X(m) < W - pad - 62) yrs.push([m, y]); }
  const pr = isParc(s) ? [0, dur, 'Permanence centralisée'] : [-3, dur, 'Permanence usagers'];
  const perm = s.prest.opts.permanence ? `<rect x="${X(pr[0])}" y="86" width="${X(pr[1]) - X(pr[0])}" height="8" rx="4" fill="${mix(s.theme.a, '#ffffff', .55)}"/><text x="${X(pr[0])}" y="110" font-family="Figtree,sans-serif" font-size="12" font-weight="600" fill="${s.theme.a}">${pr[2]}</text>` : '';

/* Mise à jour ciblée du DOM : seuls les nœuds qui changent sont touchés (aucun clignotement) */
function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType === 3 || a.nodeType === 8) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.nodeType !== 1) return;
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  const tag = a.tagName;
  if (tag === 'TEXTAREA') { if (a !== document.activeElement && a.value !== b.textContent) a.value = b.textContent; return; }
  if (tag === 'INPUT') { const v = b.getAttribute('value') ?? ''; if (a !== document.activeElement && a.value !== v) a.value = v; return; }
  const ac = [...a.childNodes], bc = [...b.childNodes];
  bc.forEach((n, i) => i < ac.length ? morph(ac[i], n) : a.appendChild(n));
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
  if (tag === 'SELECT' && a !== document.activeElement) { const o = b.querySelector('option[selected]'); if (o && a.value !== o.value) a.value = o.value; }
}
function patch(el, html) {
  if (!el.firstElementChild) { el.innerHTML = html; return; }
  const t = document.createElement('div'); t.innerHTML = html;
  const cur = [...el.childNodes], nxt = [...t.childNodes];
  nxt.forEach((n, i) => i < cur.length ? morph(cur[i], n) : el.appendChild(n));
  for (let i = nxt.length; i < cur.length; i++) cur[i].remove();
}

async function addAnnexes(files) {
  busy(true, 'Ajout des annexes…'); let n = 0;

    try {
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name), id = 'a' + uid().slice(-7);
      let rec;
      if (isPdf) rec = { type: 'pdf', name: f.name, data: await f.arrayBuffer() };
      else {
        const url = URL.createObjectURL(f), img = new Image(); img.src = url; await img.decode();
        const k = Math.min(1, 2200 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        rec = { type: 'img', name: f.name, data: c.toDataURL('image/jpeg', .88), w: c.width, h: c.height };

}

    const ovr = part => [...ct.getElementsByTagNameNS(NC, 'Override')].find(e => e.getAttribute('PartName') === '/' + part);

      if (Z.file(rf)) { const sr = await rd(Z, rf); [...sr.getElementsByTagNameNS(NK, 'Relationship')].filter(e => /notesSlide$/.test(e.getAttribute('Type'))).forEach(e => { const nf = resolve(f, e.getAttribute('Target')); Z.remove(nf); Z.remove(relsPath(nf)); ovr(nf)?.remove(); }); }
      Z.remove(f); Z.remove(rf); ovr(f)?.remove(); relOf(el.getAttributeNS(NR, 'id')).remove(); el.remove();
    }

    let maxN = Math.max(...Object.keys(Z.files).map(f => +(/^ppt\/slides\/slide(\d+)\.xml$/.exec(f)?.[1] || 0))), maxId = Math.max(...ids.map(e => +e.getAttribute('id'))), j = 0;
    const exts = new Set([...ct.getElementsByTagNameNS(NC, 'Default')].map(e => e.getAttribute('Extension').toLowerCase())), MIME = { png: 'image/png', jpeg: 'image/jpeg', jpg: 'image/jpeg', gif: 'image/gif', svg: 'image/svg+xml' };

      sections: [{ properties: { titlePage: true, page: { size: { width: 11906, height: 16838 }, margin: { top: 1134, right: 1134, bottom: 1134, left: 1134, header: 560, footer: 560 } } }, headers: { default: hdr, first: new Header({ children: [new Paragraph({ children: [] })] }) }, footers: { default: ftr, first: ftr }, children: kids }] });

}

/* --- Import d'un PowerPoint modifié : chaque forme redevient un élément de diapositive --- */
function lum(hex, lm, lo) {
  let [r, g, b] = hex2rgb(hex).map(v => v / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0, l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
  l = Math.min(1, Math.max(0, l * lm + lo)); const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { if (t < 0) t += 1; if (t > 1) t -= 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return '#' + (s === 0 ? [l, l, l] : [f(h + 1 / 3), f(h), f(h - 1 / 3)]).map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
}
async function imgVia(src, fn) { const im = new Image(); im.src = src; await im.decode(); return fn(im); }
const cropSrc = (src, sr) => imgVia(src, im => {
  const g = a => (+sr.getAttribute(a) || 0) / 100000, l = g('l'), t = g('t'), r = g('r'), b = g('b');
  const sw = im.naturalWidth * (1 - l - r), sh = im.naturalHeight * (1 - t - b); if (sw <= 0 || sh <= 0) return src;
  const c = document.createElement('canvas'); c.width = Math.round(sw); c.height = Math.round(sh); c.getContext('2d').drawImage(im, im.naturalWidth * l, im.naturalHeight * t, sw, sh, 0, 0, sw, sh);
  return c.toDataURL(/png/.test(src.slice(0, 20)) ? 'image/png' : 'image/jpeg', .9);
});
const toPNG = src => imgVia(src, im => { const c = document.createElement('canvas'); c.width = im.naturalWidth || 400; c.height = im.naturalHeight || 300; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c.toDataURL('image/png'); });

async function importPPTX(file) {
  busy(true, 'Lecture du PowerPoint…');
  try {
    await loadScript(LIBS.jszip);
    const zip = await JSZip.loadAsync(file);
    const rd = async p => { const f = zip.file(p); return f ? new DOMParser().parseFromString(await f.async('string'), 'application/xml') : null; };
    const kids = (el, n) => el ? [...el.children].filter(c => c.localName === n) : [], kid = (el, n) => kids(el, n)[0] || null;
    const resolve = (base, t) => { if (t.startsWith('/')) return t.slice(1); const parts = base.split('/'); parts.pop(); t.split('/').forEach(seg => { if (seg === '..') parts.pop(); else if (seg !== '.') parts.push(seg); }); return parts.join('/'); };
    const rels = async path => { const x = await rd(path.replace(/[^/]+$/, '') + '_rels/' + path.split('/').pop() + '.rels'), m = {}; if (x) for (const r of x.getElementsByTagName('Relationship')) m[r.getAttribute('Id')] = { t: resolve(path, r.getAttribute('Target')), raw: r.getAttribute('Target'), type: r.getAttribute('Type') || '' }; return m; };
    const pres = await rd('ppt/presentation.xml'); if (!pres) throw new Error('pptx');
    const sz = pres.getElementsByTagName('p:sldSz')[0], cx = +sz.getAttribute('cx'), cy = +sz.getAttribute('cy');
    const DW = cx / 914400, DH = cy / 914400, k = 1, ox = 0, oy = 0, EM = v => v / 914400 * k;
    const prel = await rels('ppt/presentation.xml'), theme = {};
    const thR = Object.values(prel).find(r => /\/theme$/.test(r.type)), th = thR ? await rd(thR.t) : null;
    if (th) { const cs = th.getElementsByTagName('a:clrScheme')[0]; if (cs) for (const c of cs.children) { const v = c.firstElementChild; theme[c.localName] = v ? (v.localName === 'srgbClr' ? v.getAttribute('val') : v.getAttribute('lastClr') || '000000') : '000000'; } }
    const SM = { tx1: 'dk1', bg1: 'lt1', tx2: 'dk2', bg2: 'lt2' };
    const color = el => {
      const c = el?.firstElementChild; if (!c) return null; const v = c.getAttribute('val');
      let hex = c.localName === 'srgbClr' ? v : c.localName === 'schemeClr' ? theme[SM[v] || v] : c.localName === 'sysClr' ? c.getAttribute('lastClr') : c.localName === 'prstClr' ? ({ black: '000000', white: 'FFFFFF', red: 'FF0000', green: '008000', blue: '0000FF', gray: '808080' })[v] : null;
      if (!hex) return null; hex = '#' + hex; let lm = 1, lo = 0;
      for (const m of c.children) { const n = +m.getAttribute('val') / 100000; if (m.localName === 'lumMod') lm = n; else if (m.localName === 'lumOff') lo = n; else if (m.localName === 'tint') hex = mix(hex, '#ffffff', 1 - n); else if (m.localName === 'shade') hex = mix(hex, '#000000', 1 - n); else if (m.localName === 'alpha' && n < .15) return null; }
      return lm !== 1 || lo ? lum(hex, lm, lo) : hex;
    };
    const parseText = (tx, b) => {
      const bp = kid(tx, 'bodyPr'), ins = (a, d) => bp?.getAttribute(a) != null ? EM(+bp.getAttribute(a)) : d * k;
      const lI = ins('lIns', .1), rI = ins('rIns', .1), tI = ins('tIns', .05), bI = ins('bIns', .05), ps = kids(tx, 'p'); let first = null, algn = null;
      const text = ps.map(p => { const pPr = kid(p, 'pPr'); if (algn == null && pPr?.getAttribute('algn')) algn = pPr.getAttribute('algn');
        return [...p.children].map(ch => { if (ch.localName === 'r') { first = first || kid(ch, 'rPr'); return kid(ch, 't')?.textContent || ''; } if (ch.localName === 'br') return '\n'; if (ch.localName === 'fld') return kid(ch, 't')?.textContent || ''; return ''; }).join(''); }).join('\n').replace(/\s+$/, '');
      if (!text.trim()) return null;
      first = first || ps.map(p => kid(p, 'endParaRPr')).find(Boolean);
      const sz0 = first?.getAttribute('sz') ? +first.getAttribute('sz') / 100 : 18, bold = first?.getAttribute('b') === '1', face = kid(first, 'latin')?.getAttribute('typeface') || '';
      const J = /century|jost|gothic|avenir|futura/i.test(face), size = (/century/i.test(face) ? sz0 / .9 : sz0) * k;
      return { k: 'text', x: b.x + lI, y: b.y + tI, w: Math.max(.1, b.w - lI - rI), h: Math.max(.1, b.h - tI - bI), s: text, size, color: color(kid(first, 'solidFill')) || '#' + (theme.dk1 || '000000'),
        f: J ? (bold ? 'JM' : sz0 >= 20 ? 'JL' : 'J') : /montserrat/i.test(face) ? (bold || /bold/i.test(face) ? 'MB' : /semi/i.test(face) ? 'MS' : 'M') : (bold ? 'FS' : 'F'), align: { ctr: 'center', r: 'right' }[algn] || 'left', valign: { ctr: 'middle', b: 'bottom' }[bp?.getAttribute('anchor')] || 'top', ls: first?.getAttribute('spc') ? +first.getAttribute('spc') / 100 : 0 };
    };
    const slides = []; let skipped = 0;
    for (const rid of [...pres.getElementsByTagName('p:sldId')].map(e => e.getAttribute('r:id'))) {
      const path = prel[rid]?.t; if (!path) continue;
      const x = await rd(path), srel = await rels(path), items = [];
      const cSld = x.getElementsByTagName('p:cSld')[0], bgc = color(kid(kid(kid(cSld, 'bg'), 'bgPr'), 'solidFill'));
      const layR = Object.values(srel).find(r => /slideLayout$/.test(r.type)), lay = layR ? await rd(layR.t) : null;
      const phXf = ph => { if (!lay || !ph) return null; const ty = ph.getAttribute('type'), idx = ph.getAttribute('idx'); for (const sp of lay.getElementsByTagName('p:sp')) { const p2 = sp.getElementsByTagName('p:ph')[0]; if (p2 && ((idx && p2.getAttribute('idx') === idx) || (ty && p2.getAttribute('type') === ty))) { const xf = sp.getElementsByTagName('a:xfrm')[0]; if (xf) return xf; } } return null; };
      const walk = async (parent, T) => {
        for (const el of parent.children) {
          const ln = el.localName;
          if (ln === 'grpSp') {
            const xf = kid(kid(el, 'grpSpPr'), 'xfrm'); if (!xf) { await walk(el, T); continue; }
            const g = (n, a) => +kid(xf, n)?.getAttribute(a) || 0, sx = g('ext', 'cx') / (g('chExt', 'cx') || 1), sy = g('ext', 'cy') / (g('chExt', 'cy') || 1);
            await walk(el, (x0, y0, w, h) => T(g('off', 'x') + (x0 - g('chOff', 'x')) * sx, g('off', 'y') + (y0 - g('chOff', 'y')) * sy, w * sx, h * sy)); continue;
          }
          if (ln === 'graphicFrame') { skipped++; continue; }
          if (!['sp', 'pic', 'cxnSp'].includes(ln)) continue;
          const spPr = kid(el, 'spPr'); let xf = kid(spPr, 'xfrm');
          if (!xf) { const nv = kid(el, { sp: 'nvSpPr', pic: 'nvPicPr', cxnSp: 'nvCxnSpPr' }[ln]); xf = phXf(kid(kid(nv, 'nvPr'), 'ph')); }
          const off = kid(xf, 'off'), ext = kid(xf, 'ext'); if (!off || !ext) { if (kid(el, 'txBody')?.textContent.trim()) skipped++; continue; }
          const b = T(+off.getAttribute('x'), +off.getAttribute('y'), +ext.getAttribute('cx'), +ext.getAttribute('cy'));
          if (ln === 'pic') {
            const blip = el.getElementsByTagName('a:blip')[0], svb = el.getElementsByTagNameNS('http://schemas.microsoft.com/office/drawing/2016/SVG/main', 'svgBlip')[0], tgt = srel[blip?.getAttribute('r:embed') || svb?.getAttribute('r:embed')]?.t, f = tgt && zip.file(tgt), e = (tgt || '').split('.').pop().toLowerCase();
            const mime = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', svg: 'image/svg+xml', bmp: 'image/bmp' }[e]; if (!f || !mime) { skipped++; continue; }
            let src = `data:${mime};base64,` + await f.async('base64');
            try { if (/gif|bmp|svg/.test(mime)) src = await toPNG(src); const sr = el.getElementsByTagName('a:srcRect')[0]; if (sr && [...sr.attributes].length) src = await cropSrc(src, sr); } catch (er) { }
            items.push({ k: 'img', ...b, src });
            const vf = el.getElementsByTagName('a:videoFile')[0], vu = vf && srel[vf.getAttribute('r:link')]?.raw;
            if (vu && /^https?:/i.test(vu)) items.push({ k: 'video', ...b, ...(ytId(vu) ? { yt: ytId(vu) } : { url: vu }) });
            continue;
          }
          const lnEl = kid(spPr, 'ln'), lineCol = lnEl && !kid(lnEl, 'noFill') ? color(kid(lnEl, 'solidFill')) : null, lw = lnEl?.getAttribute('w') ? +lnEl.getAttribute('w') / 12700 : .75;
          const geom = kid(spPr, 'prstGeom')?.getAttribute('prst') || (kid(spPr, 'custGeom') ? 'cust' : 'rect');
          if (ln === 'cxnSp' || geom === 'line' || /connector/i.test(geom)) { if (lineCol) { const fh = xf.getAttribute('flipH') === '1', fv = xf.getAttribute('flipV') === '1'; items.push({ k: 'line', x1: fh ? b.x + b.w : b.x, y1: fv ? b.y + b.h : b.y, x2: fh ? b.x : b.x + b.w, y2: fv ? b.y : b.y + b.h, color: lineCol, w: lw, dash: !!kid(lnEl, 'prstDash') && kid(lnEl, 'prstDash').getAttribute('val') !== 'solid' }); } continue; }
          const fill = kid(spPr, 'noFill') ? null : color(kid(spPr, 'solidFill'));
          if (fill || lineCol) {
            if (geom === 'ellipse') items.push({ k: 'ell', ...b, fill, line: lineCol, lw });
            else { let r = 0; if (geom === 'roundRect') { const gd = el.getElementsByTagName('a:gd')[0], adj = gd ? +(gd.getAttribute('fmla') || '').replace('val ', '') : 16667; r = Math.min(b.w, b.h) * adj / 100000; } items.push({ k: 'rect', ...b, fill: fill || 'none', r, line: lineCol }); }
          }
          const tx = kid(el, 'txBody'); if (tx) { const t = parseText(tx, b); if (t) items.push(t); }
        }
      };
      await walk(cSld.getElementsByTagName('p:spTree')[0], (x0, y0, w, h) => ({ x: ox + EM(x0), y: oy + EM(y0), w: EM(w), h: EM(h) }));
      slides.push({ bg: bgc || '#FFFFFF', items, imported: 1, w: DW, h: DH });
    }
    if (!slides.length) throw new Error('vide');
    const deck = { name: file.name, at: Date.now(), slides, skipped };
    await IDB.set(S.id, deck); U.deck = deck; S.pres.useDeck = true; changed(1); renderSheet();
    busy(false); toast(`${slides.length} diapositives importées${skipped ? `, ${skipped} élément(s) non repris` : ''}`);
  } catch (e) { console.error(e); busy(false); toast('PowerPoint illisible ou non pris en charge'); }
}
